[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name only — the import package and CLI command are both `sentinel`.
# (`sentinel`, `sentinel-mcp`, `mcp-sentinel` and `sentinel-proxy` were all
# unavailable on PyPI, so the published distribution is `sentinel-prox`.)
name = "sentinel-prox"
version = "0.1.1"
description = "Provenance-aware security proxy for AI agents: block prompt-injection actions at the MCP tool boundary."
requires-python = ">=3.11"
authors = [{ name = "Pali Krishna Harshith" }]
readme = "README.md"
license = { text = "MIT" }
keywords = [
    "mcp", "model-context-protocol", "ai-security", "prompt-injection",
    "ai-agents", "llm-security", "agentic-ai", "security-proxy",
    "information-flow-control", "provenance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: System :: Networking :: Monitoring",
    "Typing :: Typed",
]

# NOTE: keep `[project.urls]` (and every other sub-table) BELOW the plain keys of
# `[project]` — in TOML, a table header ends the parent table, so anything after it
# would be absorbed into the sub-table.

# Every direct dependency carries an UPPER bound as well as a floor. Floors alone
# let `pip install sentinel-prox` resolve a breaking major: mcp 2.0.0 removed an
# API we use and made the first published release fail on import. Exact tested
# versions live in versions.lock (used by CI and the container); these ranges are
# what protects a plain `pip install` for everyone else.
dependencies = [
    # Azure / Foundry
    "azure-ai-projects==2.0.0",          # Foundry; AIProjectClient is THE entry point
    "azure-identity>=1.17,<2",
    "azure-cosmos>=4.7,<5",
    "azure-monitor-opentelemetry>=1.6,<2",

    # MCP — official Python SDK (server + client)
    "mcp>=1.2,<2",

    # OpenAI — exact pin written to versions.lock after resolve
    "openai>=1.50,<3",

    # OpenTelemetry
    "opentelemetry-api>=1.27,<2",
    "opentelemetry-sdk>=1.27,<2",

    # HTTP / SSE
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "sse-starlette>=2.1,<4",
    "httpx>=0.27,<1",          # real web_fetch tool + Content Safety REST client

    # Models / config
    "pydantic>=2.9,<3",
    "pyyaml>=6.0,<7",
]

[project.urls]
Homepage = "https://github.com/Harshith029/Sentinel"
Repository = "https://github.com/Harshith029/Sentinel"
Issues = "https://github.com/Harshith029/Sentinel/issues"
Demo = "https://sentinel-i63x.onrender.com"

[project.scripts]
# The product surface: `sentinel init|check|scaffold|serve`.
sentinel = "sentinel.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "pre-commit>=3.8",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",   # stubs so `import yaml` type-checks under mypy --strict
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship the canonical authorization policy and trust config with the package so
# they are loadable via importlib.resources in both editable and wheel installs.
"sentinel" = ["py.typed"]                # PEP 561: ship inline types to consumers
"sentinel.authorization" = ["policies/*.yaml"]
"sentinel.trust" = ["config.yaml"]
"sentinel.control" = ["static/*.html", "static/fonts/*.woff2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
filterwarnings = [
    "error",
    # azure-* and opentelemetry occasionally emit deprecation noise we do not own
    "ignore::DeprecationWarning:azure.*",
    "ignore::DeprecationWarning:opentelemetry.*",
    "ignore::PendingDeprecationWarning:azure.*",
    # anyio/mcp in-memory streams are closed at GC time, which pytest surfaces as
    # an *unraisable* ResourceWarning. Under "error" this intermittently fails the
    # suite depending on GC timing (benign on Windows, fails on the Linux runner).
    # It is a third-party cleanup artifact, not a defect in our code — ignore it
    # like the azure/opentelemetry noise above.
    "ignore::ResourceWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN", "S"]
ignore = [
    "ANN101",  # missing self type
    "ANN102",  # missing cls type
    "S101",    # assert in tests is fine
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
