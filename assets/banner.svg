<svg width="640" height="190" viewBox="0 0 640 190" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SENTINEL — provenance-aware security for AI agents">
  <title>SENTINEL — provenance-aware security for AI agents</title>

  <!-- Mark: the shield boundary, with a tainted action being severed inside it. -->
  <g transform="translate(40, 52) scale(1.5)">
    <path d="M32 3.5 L57 13.5 V31 C57 45.5 45.5 56.5 32 60.5 C18.5 56.5 7 45.5 7 31 V13.5 Z"
          stroke="#38BDF8" stroke-width="3" stroke-linejoin="round" fill="none"/>
    <line x1="17" y1="30" x2="29" y2="30" stroke="#38BDF8" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="17" cy="30" r="3.6" fill="#38BDF8"/>
    <circle cx="30" cy="30" r="3.6" fill="#38BDF8"/>
    <line x1="34.5" y1="30" x2="39.5" y2="30" stroke="#F43F5E" stroke-width="2.6"
          stroke-linecap="round" stroke-dasharray="1.5 3.5"/>
    <circle cx="46" cy="30" r="3.6" fill="none" stroke="#F43F5E" stroke-width="2.6"/>
    <line x1="41.5" y1="24.5" x2="50.5" y2="35.5" stroke="#F43F5E" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="17" y1="42" x2="30" y2="42" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/>
    <circle cx="17" cy="42" r="2.6" fill="#64748B" opacity="0.85"/>
    <circle cx="30" cy="42" r="2.6" fill="#64748B" opacity="0.85"/>
  </g>

  <!-- Wordmark. #7C8CA0 is legible on both the light and dark GitHub themes,
       so the banner needs no background plate. -->
  <text x="180" y="98" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="62" font-weight="300" letter-spacing="9" fill="#7C8CA0">SENTINEL</text>
  <text x="184" y="134" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="20" font-weight="400" fill="#38BDF8">provenance-aware security for AI agents</text>
  <text x="184" y="162" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="15" font-weight="400" fill="#64748B">block prompt-injection actions at the MCP tool boundary</text>
</svg>
