name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 0   # full history needed for gitleaks staged-secret test

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Install pinned to versions.lock for a reproducible environment. -c
          # constrains versions of everything installed; platform-only pins (e.g.
          # pywin32/colorama from the Windows-generated lock) are simply not
          # installed on Linux, which is expected.
          python -m pip install -e ".[dev]" -c versions.lock

      - name: Verify versions.lock matches installed deps
        # Fail loudly on real version drift. Platform-specific pins (pywin32,
        # colorama, …) recorded on Windows are absent on a Linux runner by design
        # and are tolerated; only a co-installed package at the wrong version is
        # drift. See scripts/check_versions_lock.py.
        run: python scripts/check_versions_lock.py

      # Lint and types used to run only in release.yml, i.e. after a tag was
      # pushed: a PR could merge code that the release would then refuse. One
      # tool per step, so the run summary alone says which gate failed.
      - name: Lint (ruff)
        run: python -m ruff check src tests

      - name: Types (mypy)
        run: python -m mypy src

      - name: Install pre-commit hooks (gitleaks binary)
        run: |
          pre-commit install
          pre-commit install-hooks

      - name: pytest
        run: python -m pytest -v

  package:
    # Proves what a user installs actually works: build both artifacts, check
    # their metadata, then install the WHEEL into a fresh venv and use it from
    # outside the source tree, where an editable install would hide a missing
    # data file (the bundled policy and trust config ship as package data).
    name: package (build + install the wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip "build==1.6.1" "twine==7.0.0"
          python -m build
          python -m twine check dist/*
      - name: Install the wheel into a clean venv and smoke it
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl -c versions.lock
          cd /tmp
          /tmp/wheel-env/bin/python -c "from sentinel.authorization.policy import load_default_policy; from sentinel.trust.config import load_default_trust_config; load_default_policy(); load_default_trust_config(); print('package data OK')"
          /tmp/wheel-env/bin/sentinel --help

  container:
    # The image render.yaml and deploy/ ship. Checks it builds, starts, is
    # fail-closed with no credential, and does not run as root.
    name: container (build + smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - name: Build image
        run: docker build -f deploy/Dockerfile -t sentinel:ci .
      - name: Start and probe
        run: |
          docker run -d --name sentinel -p 8765:8765 sentinel:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/healthz > /dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/healthz
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/runs)
          test "$code" = "503" || { echo "::error::no credential configured, expected 503, got $code"; exit 1; }
          # The demo surface (dashboard, scenario runs, API docs) is off by default.
          for path in / /openapi.json /docs; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8765$path")
            test "$code" = "404" || { echo "::error::$path served by default ($code)"; exit 1; }
          done
          uid=$(docker exec sentinel id -u)
          test "$uid" != "0" || { echo "::error::the container runs as root"; exit 1; }
      - name: Container logs
        if: always()
        run: docker logs sentinel || true

  bicep:
    # deploy/main.bicep has never been deployed (see README). Compiling it on
    # every change at least keeps it from rotting into something that would not
    # even build. It does NOT show the template deploys or works.
    name: Bicep (compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - name: Compile deploy/main.bicep
        run: |
          az bicep install
          az bicep version
          az bicep build --file deploy/main.bicep --stdout > /dev/null

  supply-chain:
    name: dependency audit + secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 0   # the secret scan covers the whole history, not a diff
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.11"
      # Audits exactly what versions.lock pins. Fails the build on any known
      # vulnerability; the fix is a pin bump in versions.lock.
      #
      # One exception, because no fixed release exists:
      #   PYSEC-2026-4146 (PyJWT): decode()/decode_complete() mutate a reused
      #   `options` dict when verify_signature is off. Unreachable here as of
      #   2026-10-04: SENTINEL never imports jwt, and its only PyJWT users,
      #   mcp (client_credentials.py) and msal (oauth2cli/assertion.py), call
      #   jwt.encode only. Re-check on any mcp or msal upgrade; drop the flag
      #   once PyJWT ships a fix.
      - name: Audit pinned dependencies (pip-audit)
        run: |
          python -m pip install --upgrade pip "pip-audit==2.10.1"
          python -m pip_audit -r versions.lock --no-deps --disable-pip --progress-spinner off \
            --ignore-vuln PYSEC-2026-4146
      # The pre-commit hook scans only what is being committed; this scans every
      # commit on every ref. Same gitleaks version as .pre-commit-config.yaml.
      - name: Secret scan, full history (gitleaks)
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "$base/$archive"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $archive\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          ./gitleaks git "$GITHUB_WORKSPACE" --redact --no-banner

  real-mcp-diagnostics:
    # QUARANTINED. These exercise both remote downstream paths over real TCP, but
    # two real-HTTP MCP clients in one process wedge on the open teardown defect
    # (docs/mcp-streamable-http-teardown.md), so each test gets its own process.
    # Non-blocking until that defect is fixed; at that point drop
    # continue-on-error, delete the env gate, and fold these into the main job.
    name: real-MCP diagnostics (quarantined)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c versions.lock
      - name: Run each diagnostic in its own process
        env:
          SENTINEL_RUN_REAL_MCP_TESTS: "1"
        run: |
          set +e
          status=0
          names=$(python -m pytest tests/test_downstream_remote_paths.py             --collect-only -q -p no:cacheprovider 2>/dev/null             | grep '::' | sed 's/.*:://')
          for name in $names; do
            echo "--- $name"
            python -m pytest tests/test_downstream_remote_paths.py -k "$name"               -q -p no:cacheprovider || status=1
          done
          exit $status
