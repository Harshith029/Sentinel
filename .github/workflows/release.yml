name: release

# Publishes to PyPI when a version tag is pushed:
#   git tag -a v0.1.1 -m "..." && git push origin v0.1.1
#
# Uses PyPI Trusted Publishing (OIDC): GitHub proves the workflow's identity to
# PyPI directly, so there is NO API token to store, rotate, or leak. This must be
# configured once on PyPI first — see the "Publishing" section in CONTRIBUTING.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Never publish something that does not pass its own gates.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]" -c versions.lock
      - name: Lint, types, tests
        run: |
          python -m ruff check src tests
          python -m mypy src
          python -m pytest -q

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Confirm the tag matches the package version
        # A tag that disagrees with pyproject would publish a surprising version.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG package=$PKG"
          test "$TAG" = "$PKG" || { echo "::error::tag v$TAG != pyproject version $PKG"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi          # lets you require manual approval in repo settings
    permissions:
      id-token: write          # REQUIRED for trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
