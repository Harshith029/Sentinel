<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-labelledby="flow-title flow-desc">
  <title id="flow-title">SENTINEL refusing an exfiltration attempt</title>
  <desc id="flow-desc">An AI agent reaches its tools only through SENTINEL. Looking up a customer record is allowed. Fetching a web page is allowed, and the page's content is labelled untrusted. When the agent then tries to email the record, SENTINEL blocks the call, because its lineage includes the page.</desc>
  <style>
    .bg { fill: #0B1220; }
    .frame { fill: none; stroke: #1E293B; stroke-width: 1.5; }
    .grid { stroke: #16213A; stroke-width: 1; }
    .box { fill: #0F1A2E; stroke: #27364F; stroke-width: 1.5; }
    .core { fill: #0D1B30; stroke: #22D3EE; stroke-width: 2; }
    .link { stroke: #2A3A55; stroke-width: 2; fill: none; }
    .t1 { font: 600 17px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #E2E8F0; }
    .t2 { font: 400 12.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #94A3B8; }
    .mono { font: 500 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #E2E8F0; }
    .chip { fill: #12233D; stroke: #1F3A5F; stroke-width: 1; }
    .chipt { font: 500 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #67E8F9; }
    .head { font: 500 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #64748B; letter-spacing: .04em; }
    .cap { font: 500 15px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #CBD5E1; }
    .capk { font: 600 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .pill { font: 700 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

    .p1, .p2, .p3, .p4, .burst, .ok1, .ok2, .blk, .taint, .elink-red, .gate, .c1, .c2, .c3 { opacity: 0; }
    .p1 { animation: p1 12s linear infinite; }
    .p2 { animation: p2 12s linear infinite; }
    .p3 { animation: p3 12s linear infinite; }
    .p4 { animation: p4 12s linear infinite; }
    .burst { animation: burst 12s ease-out infinite; }
    .ok1 { animation: on18 12s linear infinite; }
    .ok2 { animation: on37 12s linear infinite; }
    .taint { animation: on54 12s linear infinite; }
    .blk, .elink-red { animation: on67 12s linear infinite; }
    .gate { animation: gate 12s ease-out infinite; }
    .c1 { animation: c1 12s linear infinite; }
    .c2 { animation: c2 12s linear infinite; }
    .c3 { animation: c3 12s linear infinite; }
    .halo { animation: halo 3s ease-in-out infinite; transform-origin: 600px 172px; }

    @keyframes p1 {
      0%, 2% { opacity: 0; transform: translate(290px, 220px); }
      3% { opacity: 1; transform: translate(290px, 220px); }
      9% { transform: translate(465px, 220px); }
      12% { transform: translate(735px, 220px); }
      18% { opacity: 1; transform: translate(910px, 220px); }
      19%, 100% { opacity: 0; transform: translate(910px, 220px); }
    }
    @keyframes p2 {
      0%, 21% { opacity: 0; transform: translate(290px, 220px); }
      22% { opacity: 1; transform: translate(290px, 220px); }
      28% { transform: translate(465px, 220px); }
      31% { transform: translate(735px, 220px); }
      37% { opacity: 1; transform: translate(910px, 110px); }
      38%, 100% { opacity: 0; transform: translate(910px, 110px); }
    }
    @keyframes p3 {
      0%, 38% { opacity: 0; transform: translate(910px, 110px); }
      39% { opacity: 1; transform: translate(910px, 110px); }
      45% { transform: translate(735px, 220px); }
      48% { transform: translate(465px, 220px); }
      54% { opacity: 1; transform: translate(290px, 220px); }
      55%, 100% { opacity: 0; transform: translate(290px, 220px); }
    }
    @keyframes p4 {
      0%, 58% { opacity: 0; transform: translate(290px, 220px) scale(1); }
      59% { opacity: 1; transform: translate(290px, 220px) scale(1); }
      66% { opacity: 1; transform: translate(452px, 220px) scale(1); }
      69%, 100% { opacity: 0; transform: translate(452px, 220px) scale(2.6); }
    }
    @keyframes burst {
      0%, 65% { opacity: 0; transform: translate(465px, 220px) scale(.4); }
      67% { opacity: 1; transform: translate(465px, 220px) scale(1); }
      76%, 100% { opacity: 0; transform: translate(465px, 220px) scale(2.8); }
    }
    @keyframes on18 { 0%, 17% { opacity: 0; } 19%, 91% { opacity: 1; } 95%, 100% { opacity: 0; } }
    @keyframes on37 { 0%, 36% { opacity: 0; } 38%, 91% { opacity: 1; } 95%, 100% { opacity: 0; } }
    @keyframes on54 { 0%, 53% { opacity: 0; } 55%, 91% { opacity: 1; } 95%, 100% { opacity: 0; } }
    @keyframes on67 { 0%, 66% { opacity: 0; } 68%, 91% { opacity: 1; } 95%, 100% { opacity: 0; } }
    @keyframes gate { 0%, 65% { opacity: 0; } 67% { opacity: 1; } 80%, 91% { opacity: .55; } 95%, 100% { opacity: 0; } }
    @keyframes c1 { 0%, 2% { opacity: 0; } 4%, 19% { opacity: 1; } 21%, 100% { opacity: 0; } }
    @keyframes c2 { 0%, 21% { opacity: 0; } 23%, 55% { opacity: 1; } 57%, 100% { opacity: 0; } }
    @keyframes c3 { 0%, 57% { opacity: 0; } 59%, 91% { opacity: 1; } 95%, 100% { opacity: 0; } }
    @keyframes halo { 0%, 100% { opacity: .25; transform: scale(1); } 50% { opacity: .55; transform: scale(1.08); } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .ok1, .ok2, .taint, .blk, .elink-red, .c3 { opacity: 1; }
    }
  </style>

  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" class="grid" fill="none"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".35"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fade" cx="50%" cy="45%" r="65%">
      <stop offset="0" stop-color="#0B1220" stop-opacity="0"/>
      <stop offset="1" stop-color="#0B1220" stop-opacity="1"/>
    </radialGradient>
  </defs>

  <rect class="bg" width="1200" height="440" rx="18"/>
  <rect width="1200" height="440" rx="18" fill="url(#g)"/>
  <rect width="1200" height="440" rx="18" fill="url(#fade)"/>
  <rect class="frame" x=".75" y=".75" width="1198.5" height="438.5" rx="17.5"/>

  <text class="head" x="40" y="44">A POISONED PAGE TRIES TO EXFILTRATE A CUSTOMER RECORD</text>

  <!-- links (drawn under the boxes, so packets pass "through" SENTINEL) -->
  <path class="link" d="M290 220H465"/>
  <path class="link" d="M735 220L910 110"/>
  <path class="link" d="M735 220H910"/>
  <path class="link" d="M735 220L910 330"/>
  <path class="elink-red" d="M735 220L910 330" stroke="#F43F5E" stroke-width="2.5" stroke-dasharray="6 6" fill="none"/>

  <!-- packets -->
  <circle class="p1" r="6.5" fill="#22D3EE"/>
  <circle class="p2" r="6.5" fill="#22D3EE"/>
  <circle class="p3" r="6.5" fill="#F59E0B"/>
  <circle class="p4" r="6.5" fill="#F43F5E"/>
  <circle class="burst" r="16" fill="none" stroke="#F43F5E" stroke-width="3"/>

  <!-- agent -->
  <rect class="box" x="60" y="170" width="230" height="100" rx="14"/>
  <rect class="taint" x="60" y="170" width="230" height="100" rx="14" fill="none" stroke="#F59E0B" stroke-width="2"/>
  <text class="t1" x="84" y="212">AI agent</text>
  <text class="t2" x="84" y="236">any MCP client</text>
  <text class="t2 taint" x="60" y="296" fill="#F59E0B" style="fill:#FBBF24">lineage now includes RETRIEVED_CONTENT</text>

  <!-- SENTINEL -->
  <circle class="halo" cx="600" cy="172" r="54" fill="url(#glow)"/>
  <rect class="core" x="465" y="120" width="270" height="200" rx="18"/>
  <rect class="gate" x="465" y="120" width="270" height="200" rx="18" fill="none" stroke="#F43F5E" stroke-width="3"/>
  <g transform="translate(578 140) scale(.70)">
    <path d="M32 3.5 L57 13.5 V31 C57 45.5 45.5 56.5 32 60.5 C18.5 56.5 7 45.5 7 31 V13.5 Z" stroke="#38BDF8" stroke-width="3" stroke-linejoin="round" fill="none"/>
    <line x1="17" y1="30" x2="29" y2="30" stroke="#38BDF8" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="17" cy="30" r="3.6" fill="#38BDF8"/>
    <circle cx="30" cy="30" r="3.6" fill="#38BDF8"/>
    <line x1="34.5" y1="30" x2="39.5" y2="30" stroke="#F43F5E" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="1.5 3.5"/>
    <circle cx="46" cy="30" r="3.6" fill="none" stroke="#F43F5E" stroke-width="2.6"/>
    <line x1="41.5" y1="24.5" x2="50.5" y2="35.5" stroke="#F43F5E" stroke-width="2.6" stroke-linecap="round"/>
  </g>
  <text class="t1" x="600" y="214" text-anchor="middle">SENTINEL</text>
  <g>
    <rect class="chip" x="487" y="234" width="108" height="26" rx="7"/>
    <text class="chipt" x="541" y="251.5" text-anchor="middle">1 trace</text>
    <rect class="chip" x="605" y="234" width="108" height="26" rx="7"/>
    <text class="chipt" x="659" y="251.5" text-anchor="middle">2 authorize</text>
    <rect class="chip" x="487" y="270" width="108" height="26" rx="7"/>
    <text class="chipt" x="541" y="287.5" text-anchor="middle">3 contain</text>
    <rect class="chip" x="605" y="270" width="108" height="26" rx="7"/>
    <text class="chipt" x="659" y="287.5" text-anchor="middle">4 record</text>
  </g>

  <!-- tools -->
  <rect class="box" x="910" y="78" width="250" height="64" rx="12"/>
  <text class="mono" x="930" y="106">web_fetch</text>
  <text class="t2" x="930" y="126">reads the open web</text>
  <g class="ok2">
    <rect x="1086" y="98" width="58" height="22" rx="11" fill="#052E1F" stroke="#10B981"/>
    <text class="pill" x="1115" y="113" text-anchor="middle" fill="#34D399">ALLOW</text>
  </g>

  <rect class="box" x="910" y="188" width="250" height="64" rx="12"/>
  <text class="mono" x="930" y="216">get_customer_record</text>
  <text class="t2" x="930" y="236">trusted_output: true</text>
  <g class="ok1">
    <rect x="1086" y="208" width="58" height="22" rx="11" fill="#052E1F" stroke="#10B981"/>
    <text class="pill" x="1115" y="223" text-anchor="middle" fill="#34D399">ALLOW</text>
  </g>

  <rect class="box" x="910" y="298" width="250" height="64" rx="12"/>
  <text class="mono" x="930" y="326">send_email</text>
  <text class="t2" x="930" y="346">guarded by a taint rule</text>
  <g class="blk">
    <rect x="1086" y="318" width="58" height="22" rx="11" fill="#3B0A16" stroke="#F43F5E"/>
    <text class="pill" x="1115" y="333" text-anchor="middle" fill="#FB7185">BLOCK</text>
  </g>

  <!-- captions -->
  <text class="cap c1" x="40" y="408"><tspan class="capk" fill="#67E8F9">get_customer_record</tspan>  allowed: the records service is marked trusted, so nothing is tainted yet</text>
  <text class="cap c2" x="40" y="408"><tspan class="capk" fill="#67E8F9">web_fetch</tspan>  allowed, but the page it returns is labelled <tspan class="capk" fill="#FBBF24">RETRIEVED_CONTENT</tspan></text>
  <text class="cap c3" x="40" y="408"><tspan class="capk" fill="#FB7185">send_email</tspan>  refused before it runs: its lineage includes the page, whatever the page said</text>
</svg>
