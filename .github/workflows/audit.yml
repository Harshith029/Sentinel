name: dependency audit

# CI audits dependencies on every pull request and push to main. An advisory
# published while nothing changed went unnoticed until the next pull request
# failed on it (twice in October 2026). This runs the same audits every week.
# GitHub emails the owner when a scheduled run fails; the fix is a pin bump in
# versions.lock or website/package.json.
#
# GitHub pauses scheduled workflows in a public repository after 60 days
# without activity; re-enable it from the Actions tab if that happens.

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: versions.lock (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.11"
      - name: Audit pinned dependencies
        run: bash scripts/audit_pinned_deps.sh

  website:
    name: website (npm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install (locked)
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
