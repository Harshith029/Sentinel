# SENTINEL canonical authorization policy (BUILD_SPEC §2B).
#
# Deny-only rules: a tool call is ALLOWED iff NO deny rule matches. Rules
# evaluate in listed order and the FIRST matching deny short-circuits
# (deny-overrides). Unknown tools are default-denied by the engine.
#
# Predicate variables resolve from the normalized ToolCall namespace:
#   * effective_provenance  — the §4.2 provenance SET (frozenset of labels)
#   * typed tool args        — e.g. recipient_domain, amount
#   * config                 — e.g. allowed_domains, max_amount
policy_version: 3
tools:
  # web_fetch is a READ tool: always permitted (no deny rules). It is, however,
  # the primary SOURCE of taint — its results are tagged RETRIEVED_CONTENT by the
  # proxy, so any later action derived from a fetched page is caught downstream.
  web_fetch:
    rules: []

  send_email:
    rules:
      - id: block-untrusted-origin
        deny_if: "RETRIEVED_CONTENT in effective_provenance"
      - id: domain-allowlist
        deny_if: "recipient_domain not in allowed_domains"

  get_customer_record:
    rules:
      - id: user-initiated-only
        deny_if: "RETRIEVED_CONTENT in effective_provenance"

  delete_record:
    rules:
      - id: never
        deny_always: true

  # transfer_funds is a POLICY EXAMPLE: it shows the strict "USER-only origin +
  # amount cap" pattern a real deployment would use for a high-risk financial
  # action. The demo's mock tool servers do not register transfer_funds, so it is
  # not exercised by the shipped scenarios — it documents the policy shape.
  transfer_funds:
    rules:
      - id: user-only
        deny_if: "effective_provenance != {USER}"
      - id: cap
        deny_if: "amount >= max_amount"
