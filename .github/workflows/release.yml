name: release

# Publishes to PyPI when a version tag is pushed:
#   git tag -a v0.1.1 -m "..." && git push origin v0.1.1
#
# Uses PyPI Trusted Publishing (OIDC): GitHub proves the workflow's identity to
# PyPI directly, so there is NO API token to store, rotate, or leak. This must be
# configured once on PyPI first — see the "Publishing" section in CONTRIBUTING.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Never publish something that does not pass its own gates.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]" -c versions.lock
      # Separate steps on purpose: a combined step only reports "something
      # failed", and job logs need admin rights to read. One tool per step makes
      # the failure identifiable from the run summary alone.
      - name: Tool versions
        run: |
          python -m ruff --version
          python -m mypy --version
          python -m pytest --version
      - name: Lint (ruff)
        run: python -m ruff check src tests
      - name: Types (mypy)
        run: python -m mypy src
      # tests/test_phase0_gitleaks.py asserts that commits are actually being
      # secret-scanned, so it needs the hook installed and the gitleaks binary
      # fetched. ci.yml does this too — keep the two workflows in step.
      - name: Install pre-commit hooks (gitleaks binary)
        run: |
          pre-commit install
          pre-commit install-hooks
      - name: Tests (pytest)
        run: python -m pytest -q

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.11"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip "build==1.6.1" "twine==7.0.0"
          python -m build
          python -m twine check dist/*
      - name: Confirm the tag matches the package version
        # A tag that disagrees with pyproject would publish a surprising version.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG package=$PKG"
          test "$TAG" = "$PKG" || { echo "::error::tag v$TAG != pyproject version $PKG"; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi          # lets you require manual approval in repo settings
    permissions:
      id-token: write          # REQUIRED for trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
