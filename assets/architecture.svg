<svg width="820" height="300" viewBox="0 0 820 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Architecture: the agent reaches its tools only through WHENCE">
  <title>WHENCE architecture</title>
  <!-- Stroked, transparent-background boxes so the diagram reads on both the light
       and dark GitHub themes without a background plate. -->
  <style>
    .box   { fill: none; stroke: #64748B; stroke-width: 1.6; }
    .core  { fill: none; stroke: #38BDF8; stroke-width: 2; }
    .hdr   { font: 600 15px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #7C8CA0; letter-spacing: 1.2px; }
    .core-hdr { font: 600 15px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #38BDF8; letter-spacing: 1.2px; }
    .sub   { font: 400 11.5px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #64748B; }
    .step  { font: 600 12.5px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #7C8CA0; }
    .desc  { font: 400 11px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #64748B; }
    .num   { font: 300 15px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #38BDF8; }
    .edge  { font: 500 10.5px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #64748B; letter-spacing: 1px; }
    .note  { font: italic 400 12px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #38BDF8; }
  </style>

  <!-- your agent -->
  <rect class="box" x="14" y="86" width="168" height="96" rx="8"/>
  <text class="hdr"  x="98" y="126" text-anchor="middle">YOUR AGENT</text>
  <text class="sub"  x="98" y="147" text-anchor="middle">Foundry · Claude · GPT</text>
  <text class="sub"  x="98" y="163" text-anchor="middle">or anything MCP</text>

  <!-- agent -> whence -->
  <line x1="188" y1="134" x2="242" y2="134" stroke="#38BDF8" stroke-width="1.8"/>
  <path d="M242 134 l-8 -4.5 v9 z" fill="#38BDF8"/>
  <text class="edge" x="215" y="124" text-anchor="middle">MCP</text>

  <!-- whence -->
  <rect class="core" x="248" y="34" width="324" height="212" rx="10"/>
  <text class="core-hdr" x="272" y="62">WHENCE</text>

  <text class="num"  x="274" y="100">1</text>
  <text class="step" x="296" y="100">Trace</text>
  <text class="desc" x="378" y="100">where every byte came from</text>

  <text class="num"  x="274" y="136">2</text>
  <text class="step" x="296" y="136">Authorize</text>
  <text class="desc" x="378" y="136">policy decides using that lineage</text>

  <text class="num"  x="274" y="172">3</text>
  <text class="step" x="296" y="172">Contain</text>
  <text class="desc" x="378" y="172">trust score → quarantine</text>

  <text class="num"  x="274" y="208">4</text>
  <text class="step" x="296" y="208">Record</text>
  <text class="desc" x="378" y="208">replayable forensic evidence</text>

  <!-- whence -> tools -->
  <line x1="578" y1="134" x2="632" y2="134" stroke="#38BDF8" stroke-width="1.8"/>
  <path d="M632 134 l-8 -4.5 v9 z" fill="#38BDF8"/>
  <text class="edge" x="605" y="124" text-anchor="middle">MCP</text>

  <!-- your servers -->
  <rect class="box" x="638" y="86" width="168" height="96" rx="8"/>
  <text class="hdr" x="722" y="126" text-anchor="middle">YOUR MCP</text>
  <text class="hdr" x="722" y="145" text-anchor="middle">SERVERS</text>
  <text class="sub" x="722" y="166" text-anchor="middle">reachable only via WHENCE</text>

  <text class="note" x="410" y="278" text-anchor="middle">Interception is guaranteed by network topology — nothing in the agent to forget, disable, or bypass.</text>
</svg>
