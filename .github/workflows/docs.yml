name: docs

# Builds the project site (website/, VitePress) on every change to it, and
# publishes it to GitHub Pages from main. Pull requests only build: a broken
# link or page fails here before it can reach the published site.

on:
  push:
    branches: [main]
    paths: ["website/**", "assets/**", ".github/workflows/docs.yml"]
  pull_request:
    branches: [main]
    paths: ["website/**", "assets/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 0   # "last updated" dates come from git history

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install (locked)
        run: npm ci

      # The site's dependencies are build tools only, but a known vulnerability
      # in them still fails the build, as pip-audit does for the package.
      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Build (fails on dead links)
        run: npm run build

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: website/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
