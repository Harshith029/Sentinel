# Render.com blueprint — one-click live deploy of the Whence demo.
#
# Free tier: the service sleeps after ~15 min of inactivity and cold-starts in
# under a minute on the next request. The dashboard, the one-click attacks, and
# the /mcp wire endpoint are all served by this single container (the same image
# `make serve` runs locally). All data is synthetic; nothing real is sent.
services:
  - type: web
    name: whence
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: WHENCE_DEMO_MODE
        value: "1"
      # This blueprint deploys a PUBLIC SANDBOX with synthetic data, so it runs
      # without authentication ON PURPOSE — and now has to say so. Whence is
      # fail-closed: with neither a token nor this flag it refuses to serve
      # rather than serving openly, which is what stops a real deployment from
      # being exposed by an omission. That protection is only meaningful if the
      # demo declares its posture instead of inheriting it by accident.
      #
      # DO NOT COPY THIS INTO A REAL DEPLOYMENT. Drop this key and set
      # WHENCE_API_TOKEN instead (Render can mint one for you):
      #
      #   - key: WHENCE_API_TOKEN
      #     generateValue: true
      #
      # Anonymous mode leaves /mcp open, so anyone who can reach the URL can
      # drive the tools behind it. Here they are in-memory mocks with no egress;
      # in front of your own MCP servers they would not be.
      - key: WHENCE_ALLOW_ANONYMOUS
        value: "1"
